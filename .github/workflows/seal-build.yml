# Sealed build: upstream builds and tests on Jenkins (Jenkinsfile + ci/test.sh),
# not GitHub Actions. This mirrors ci/test.sh (`./mvnw -s settings.xml clean
# dependency:list verify -Dsort -U -B`) on the Jenkins JDK pair (main 17, next 21),
# scoped to the spring-data-relational module.
name: Seal build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Build and test spring-data-relational
        env:
          MAVEN_OPTS: -Duser.name=spring-builds+jenkins
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw -s settings.xml -Dscan=false -Dgradle.cache.local.enabled=false -Dgradle.cache.remote.enabled=false \
              -pl spring-data-relational -am clean verify -B -DskipITs \
              -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw -s settings.xml -Dscan=false -Dgradle.cache.local.enabled=false -Dgradle.cache.remote.enabled=false \
              -pl spring-data-relational -am clean dependency:list verify -Dsort -U -B
          fi

      - name: Report skipped tests
        if: always()
        run: |
          echo "Skipped tests (from surefire/failsafe XML reports):"
          for f in spring-data-relational/target/surefire-reports/TEST-*.xml spring-data-relational/target/failsafe-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for tc in root.iter('testcase'):
              s = tc.find('skipped')
              if s is not None:
                  print(f"SKIPPED {tc.get('classname')}.{tc.get('name')}: {s.get('message') or (s.text or '').strip() or 'no message (@Disabled/assumption)'}")
          EOF
          done

      - name: Upload jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: spring-data-relational-jar
          path: spring-data-relational/target/spring-data-relational-3.3.1.jar
          if-no-files-found: error
